; SA_CnCDDraw - Mental Omega 3.3.6
; The client copies this template to ddraw.ini when applying CnC-DDraw.
[ddraw]
width=0
height=0
fullscreen=false
windowed=false
border=true
maintas=false
boxing=false
renderer=auto
shader=Bilinear
d3d9_filter=1
vsync=false
maxfps=60
minfps=-1
maxgameticks=0
singlecpu=true
savesettings=1

; Yuri's Revenge compatibility profile from CnC-DDraw 7.1.
[gamemd]
nonexclusive=false
noactivateapp=true
tshack=true

[gamemd-spawn]
nonexclusive=false
noactivateapp=true
tshack=true
